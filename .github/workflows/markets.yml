name: markets
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/markets.mjs
      - run: |
          git config user.name "markets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add markets.json
          git diff --cached --quiet || (git commit -m "update markets" && git pull --rebase -q && git push)

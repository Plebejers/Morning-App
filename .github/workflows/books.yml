name: books
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/books.mjs
      - scripts/books.config.json
      - .github/workflows/books.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/books.mjs
      - run: |
          git config user.name "books-bot"
          git config user.email "bot@users.noreply.github.com"
          git add books
          git diff --cached --quiet || (git commit -m "update books" && git pull --rebase -q && git push)

:root{--ts:min(54px,calc((100vw - 196px)/4.72),calc((100vw - 82px)/6.82));--bg:#000;--card:#111;--card2:#1a1a1a;--line:#2a2a2a;--tx:#fff;--mu:#8c8c8c;--ac:var(--tx);--dim:#2a2a2a;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f1f1f1;--card:#fff;--card2:#f1f1f1;--line:#dcdcdc;--tx:#0a0a0a;--mu:#6e6e6e;--dim:#dcdcdc;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 'Space Grotesk',system-ui,sans-serif;padding:20px 16px 32px;max-width:520px;background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:18px 18px}
h1,.card h2,label,.sub,small,.mono{font-family:'Space Mono',ui-monospace,monospace}
h1{font-size:12px;font-weight:400;color:var(--mu);margin:6px 0 0;letter-spacing:.14em;text-transform:uppercase}
h1:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:8px}
#clock,.big{font-family:'NDot','Doto','Space Mono',monospace;font-weight:400;letter-spacing:0}
#clock{font-size:96px;line-height:1;margin:6px 0 18px}
.card{background:var(--card);border-radius:28px;padding:20px;margin-bottom:14px}
.mkb{display:block;text-align:center;background:var(--tx);color:var(--bg);border-radius:999px;padding:14px;font:700 13px 'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.card h2{margin:0 0 16px;font:400 var(--ts)/1.05 'NDot','Doto','Space Mono',monospace;color:var(--tx);letter-spacing:.02em;text-transform:none}
.big{font-size:30px;line-height:1.1}
.sub{color:var(--mu);font-size:12px;letter-spacing:.02em}
.row{display:flex;gap:8px;margin-top:12px}
.row>label{flex:1;font-size:10px;color:var(--mu);display:block;text-transform:uppercase;letter-spacing:.1em}
input,select{width:100%;margin-top:6px;background:var(--card2);color:var(--tx);border:0;border-radius:16px;padding:12px 14px;font:500 15px 'Space Grotesk',system-ui,sans-serif;outline:none}
input:focus,select:focus{box-shadow:0 0 0 1.5px var(--ac)}
input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--ac);border-radius:50%}
button,.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--tx);color:var(--bg);border:0;border-radius:999px;padding:14px;font:700 13px 'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-top:12px;cursor:pointer}
.btn.red{background:var(--tx);color:var(--bg)}
button.ghost,.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
button.sm{display:inline-block;width:auto;padding:10px 16px;font-size:12px;margin:0}
.late,.soon{color:var(--tx);font-weight:700}.good{color:var(--mu)}
ul{list-style:none;margin:0;padding:0}
li.step{cursor:pointer;display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px dotted var(--line)}
li.step:last-child{border:0}
li.step .t{flex:1}
li.step.done .t b{text-decoration:line-through;color:var(--mu)}
li.step small{color:var(--mu);display:block;font-size:11px}
#leaveBy,#leaveSub{text-align:center}
details#setup summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:999px;padding:12px 18px;font:700 13px 'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
details#setup summary::-webkit-details-marker{display:none}
details#setup summary:after{content:'+';font-size:18px}
details#setup[open] summary:after{content:'\2212'}
#hourly{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}
@media (max-width:340px){#hourly{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hr{background:var(--card2);border-radius:16px;padding:9px 0 7px;text-align:center;min-width:0}
.hr .h{font:400 10px 'Space Mono',monospace;color:var(--mu);letter-spacing:.02em;white-space:nowrap}
.hr svg{width:30px;height:30px;margin:8px auto;display:block;color:var(--tx)}
.hr .d{font:400 24px/1 'NDot','Doto',monospace}
.hr .p{font:400 10px 'Space Mono',monospace;color:var(--mu);margin-top:5px;min-height:11px}
#chead{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
#whead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 10px;margin-bottom:16px}
#whead h2{margin:0}
#wtemp{font:400 var(--ts)/1.05 'NDot','Doto',monospace;color:var(--tx);white-space:nowrap}
#chead h2{margin:0;flex:0 0 auto}
#arr{display:grid;grid-template-columns:repeat(2,auto);gap:4px;flex:0 0 auto}
#arr button{margin:0;width:auto;padding:3px 7px 4px;background:transparent;color:var(--tx);border:1px solid var(--line);font:400 18px/1.05 'NDot','Doto',monospace;letter-spacing:0;text-transform:none}
#arr button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#arr button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.st{font:400 26px/1 'NDot','Doto',monospace;margin:22px 0 4px;color:var(--tx)}
.hr.past{opacity:.4}
.hr.now{box-shadow:inset 0 0 0 1.5px var(--tx)}
textarea{width:100%;min-height:140px;resize:vertical;background:var(--card2);color:var(--tx);border:0;border-radius:18px;padding:14px;font:500 15px/1.45 'Space Grotesk',system-ui,sans-serif;outline:none}
textarea:focus{box-shadow:0 0 0 1.5px var(--tx)}
.bar{height:8px;margin:10px 0 6px;background:repeating-linear-gradient(90deg,var(--dim) 0 6px,transparent 6px 10px)}
.bar i{display:block;height:100%;width:0;transition:width .3s;background:repeating-linear-gradient(90deg,var(--ac) 0 6px,transparent 6px 10px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--card2);border-radius:999px;padding:7px 14px;font-size:13px}
.alert{background:var(--tx);color:var(--bg);border-radius:18px;padding:12px 14px;margin-top:12px;font-weight:600}
.edit input{margin:0;min-width:0}
li.step.edit{flex-wrap:wrap;gap:6px}
li.step small.tm{color:var(--mu);font-size:11px}
.edit .sm{padding:8px 9px;font-size:10px}
.edit .sm.on{background:var(--tx);color:var(--bg)}
.hide{display:none}
.card.fold>*:not(.fh){display:none!important}
.card h2{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#wtemp,.card h2{outline:none}
.rng{display:flex;gap:6px;margin-top:10px}
.rng button{margin:0;width:auto;padding:3px 9px 4px;background:transparent;color:var(--tx);border:1px solid var(--line);font:400 16px/1.05 'NDot','Doto',monospace;letter-spacing:0;text-transform:none}
.rng button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.rt{margin-top:14px;border-top:1px dotted var(--line)}
.rt .r{display:flex;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:14px;line-height:1.35}
.rt .r b{flex:0 0 52px;font:400 18px/1.1 'NDot','Doto',monospace}
.rt .r small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
#rtBtns button.ghost{background:transparent}
</style>
</head>
<body>
<h1 id="greet" class="hide">Good morning</h1>
<div id="clock" class="hide">--:--</div>

<section class="card">
  <div id="chead"><h2>Commute</h2><div id="arr"><button data-t="07:30">7:30</button><button data-t="07:45">7:45</button><button data-t="08:00">8:00</button><button data-t="08:15">8:15</button></div></div>
  <div id="go" style="display:flex;flex-direction:column;margin-bottom:14px">
    <a class="btn" id="toWork" href="#" target="_blank" rel="noopener">To work</a>
    <a class="btn" id="toHome" href="#" target="_blank" rel="noopener">To home</a>
    <div id="rtBtns" style="display:flex;gap:10px"><button type="button" id="rtBus" style="flex:1">Bus</button><button type="button" id="rtWalk" style="flex:1">Walk</button></div>
    <div id="rtOut"></div>
  </div>

  <div style="margin-top:18px"><div class="big" id="leaveBy">--:--</div>
  <div class="sub" id="leaveSub"></div></div>
</section>

<section class="card">
  <div id="whead"><h2>Weather</h2><div id="wtemp"></div></div>
  <div id="wxAlert"></div>
  <div id="hourly"></div>
  <div id="wxOut" class="sub" style="margin-top:14px"></div>
  <div id="manual" class="hide">
    <div class="row">
      <label>Feels like (°C)<input type="number" id="mTemp" inputmode="numeric"></label>
      <label>High (°C)<input type="number" id="mHi" inputmode="numeric"></label>
      <label>Rain/snow %<input type="number" id="mRain" min="0" max="100" inputmode="numeric"></label>
    </div>
    <div class="row" style="align-items:center"><input type="checkbox" id="mSnow" style="width:22px"><label style="font-size:14px;color:var(--tx)">Snow expected</label></div>
    <a class="btn ghost" id="gWx" href="#" target="_blank" rel="noopener">Look up today's forecast</a>
  </div>
  <div id="wear"></div>
</section>

<section class="card">
  <h2>Routine</h2>
  <div class="sub" id="startBy"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="sub" id="progTxt"></div>
  <ul id="steps"></ul>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="ghost sm" id="editBtn">Edit steps</button>
    <button class="ghost sm" id="resetBtn">Reset today</button>
  </div>
</section>

<section class="card">
  <h2>Markets</h2>
  <div id="mkVeqt"></div>
  <div id="mkFut"></div>
  <div class="sub" id="mkSum" style="margin-top:12px"></div>
  <div id="mkNews" style="margin-top:14px"></div>
</section>

<section class="card">
  <h2>Recap</h2>
  <div id="rcOut"><div class="sub">No recap yet.</div></div>
</section>

<section class="card">
  <h2>Stocks</h2>
  <div class="row"><input type="text" id="stkIn" placeholder="Company or ticker" autocapitalize="characters" autocomplete="off" style="flex:1 1 0;min-width:0"><button class="sm" id="stkGo">Search</button></div>
  <div id="stkOut" style="margin-top:12px"></div>
</section>

<section class="card">
  <h2>News</h2>
  <div id="gNews"></div>
</section>

<section class="card">
  <h2>Notes</h2>
  <textarea id="notes" rows="5" placeholder="Write something..."></textarea>
</section>

<section class="card" id="setupCard">
  <h2>Setup</h2>
  <div class="row">
    <label>Wake up<input type="time" id="wake"></label>
  </div>
  <div class="row">
    <label>At work by<input type="time" id="arrive"></label>
    <label>Usual trip<input type="number" id="commute" min="1" inputmode="numeric"></label>
    <label>Buffer<input type="number" id="buffer" min="0" inputmode="numeric"></label>
  </div>
  <div class="row">
    <label style="flex:1">Home<input type="text" id="home" placeholder="Enter your home address"></label>
  </div>
  <div class="row">
    <label style="flex:2">Work<input type="text" id="work" placeholder="Enter your work address"></label>
    <label>Mode<select id="mode"><option value="driving">Drive</option><option value="transit">Transit</option><option value="bicycling">Bike</option><option value="walking">Walk</option></select></label>
  </div>
  <div class="row">
    <label style="flex:3">City Weather<input type="text" id="city" placeholder="e.g. Ottawa"></label>
    <button class="sm" id="wxGo" style="align-self:flex-end;margin-bottom:0">Go</button>
  </div>
  <button class="ghost" id="locBtn">Use my location</button>
  <div class="row"><label style="flex:1">Stock proxy URL<input type="text" id="proxy" placeholder="https://xxxx.workers.dev"></label></div>
  <div class="sub" style="margin-top:12px">build 94</div>
</section>

<script>
(function(){
var KEY='morning-v1';
var DEF={rt:'',proxy:'',stk:'',arrive:'08:00',commute:25,buffer:10,home:'',work:'',mode:'driving',city:'',lat:null,lon:null,
 v:2,wake:'06:30',notes:'',
 steps:[{n:'Get up, water',m:1},{n:'Shower',m:10},{n:'Get dressed',m:5},{n:'Pack bag and lunch',m:1},{n:'Breakfast and coffee',m:0,flex:true}],
 done:{date:'',ids:[]}};
var S=JSON.parse(JSON.stringify(DEF));
var loadedV=2;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);loadedV=p.v||0;for(var k in p)S[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(id){return document.getElementById(id);}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
if(loadedV<2){S.steps=JSON.parse(JSON.stringify(DEF.steps));S.v=2;S.done={date:'',ids:[]};save();}
if(!S.wake)S.wake=DEF.wake;
if(!S.home)S.home=DEF.home;if(!S.work)S.work=DEF.work;
if(S.done.date!==today())S.done={date:today(),ids:[]};
function toMin(t){var a=(t||'0:0').split(':');return (+a[0])*60+(+a[1]);}
function fmt(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var editing=false,forceRender=false;
function rerender(){forceRender=true;$('steps').removeAttribute('data-sig');update();forceRender=false;}
$('arr').addEventListener('click',function(e){var t=e.target.getAttribute('data-t');if(!t)return;S.arrive=t;$('arrive').value=t;save();drawRt();update();});
['toWork','toHome'].forEach(function(id){$(id).addEventListener('click',function(e){var k=id==='toWork'?'work':'home';if(!S[k]){e.preventDefault();$(k).focus();}});});

// inputs
$('arrive').value=S.arrive;$('wake').value=S.wake;$('commute').value=S.commute;$('buffer').value=S.buffer;$('home').value=S.home;$('work').value=S.work;$('mode').value=S.mode;$('city').value=S.city;
function bind(id,key,num){$(id).addEventListener('input',function(){var v=this.value;S[key]=num?(+v||0):v;save();update();});}
bind('arrive','arrive');$('proxy').value=S.proxy||'';bind('proxy','proxy');$('notes').value=S.notes||'';$('notes').addEventListener('input',function(){S.notes=this.value;save();});bind('wake','wake');bind('commute','commute',1);bind('buffer','buffer',1);bind('home','home');bind('work','work');bind('mode','mode');

function nextArrival(now){
  var p=(S.arrive||'08:00').split(':'),d=new Date(now.getTime());
  d.setHours(+p[0],+p[1],0,0);
  if(d.getTime()<=now.getTime())d.setDate(d.getDate()+1);
  while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  return d;
}
function leaveMin(){var a=(typeof RT!=='undefined'&&typeof rtOpen!=='undefined'&&rtOpen&&RT[S.arrive])?RT[S.arrive][rtOpen]:null;if(a){var p=a[0][0].split(':');return (+p[0])*60+(+p[1])-10;}return toMin(S.arrive)-S.commute-S.buffer;}
function totalSteps(){return S.steps.reduce(function(a,s){return a+(s.flex?0:(+s.m||0));},0);}
function stepMin(s){return s.flex?Math.max(0,Math.round(leaveMin()-toMin(S.wake)-totalSteps())):(+s.m||0);}

function update(){
  var now=new Date(),nm=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  $('clock').textContent=fmt(Math.floor(nm));
  var h=now.getHours();
  $('greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  var lv=leaveMin();$('leaveBy').textContent='Leave by '+fmt(lv);
  var diff=Math.round(lv-nm),el=$('leaveSub');
  el.textContent='';el.className='sub';
  Array.prototype.forEach.call($('arr').querySelectorAll('button'),function(b){b.className=b.getAttribute('data-t')===S.arrive?'on':'';});
  // maps links
  var base='https://www.google.com/maps/dir/?api=1&travelmode='+encodeURIComponent(S.mode)+'&destination=';
  var tgt=nextArrival(now),md={driving:0,bicycling:1,walking:2,transit:3}[S.mode];
  var wp=S.work?'/maps/dir//'+encodeURIComponent(S.work)+'/data=!4m6!4m5!2m3!6e1!7e2!8j'+(Date.UTC(tgt.getFullYear(),tgt.getMonth(),tgt.getDate(),tgt.getHours(),tgt.getMinutes())/1000)+'!3e'+(md===undefined?0:md):'';
  $('toWork').href=wp?'https://www.google.com'+wp:'#';
  $('toHome').href=S.home?base+encodeURIComponent(S.home):'#';
  if(S.work){$('toWork').innerHTML='To work<small style="display:block;font-weight:400;opacity:.7;margin-top:2px;letter-spacing:.04em">arrive '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][tgt.getDay()]+' '+S.arrive+'</small>';}else{$('toWork').textContent='Set work address';}
  $('toHome').textContent=S.home?'To home':'Set home address';
  $('toWork').className='btn';$('toHome').className='btn';
  renderSteps(nm);
}

function renderSteps(nm){
  var all=S.steps.reduce(function(a,x){return a+stepMin(x);},0),start=leaveMin()-all;
  $('startBy').textContent='Start by '+fmt(start);
  var t=start,html='',done=0;
  S.steps.forEach(function(s,i){
    var isDone=S.done.ids.indexOf(i)>-1;if(isDone)done++;
    if(editing){
      html+='<li class="step edit"><input type="text" data-i="'+i+'" data-f="n" value="'+esc(s.n)+'" style="flex:1 1 0;min-width:0;padding:10px">'+(s.flex?'<span class="sub" style="flex:0 0 52px;text-align:center">rest</span>':'<input type="number" data-i="'+i+'" data-f="m" value="'+s.m+'" style="flex:0 0 52px;width:52px;padding:10px 6px;text-align:center" inputmode="numeric">')+'<button class="ghost sm'+(s.flex?' on':'')+'" data-fill="'+i+'">fill</button>'+(i>0?'<button class="ghost sm" data-up="'+i+'">&uarr;</button>':'<button class="ghost sm" style="visibility:hidden" tabindex="-1" aria-hidden="true">&uarr;</button>')+'<button class="ghost sm" data-del="'+i+'">x</button><small class="tm" data-tm="'+i+'" style="flex-basis:100%"></small></li>';
    }else{
      html+='<li class="step'+(isDone?' done':'')+'"><input type="checkbox" data-chk="'+i+'"'+(isDone?' checked':'')+'><div class="t"><b>'+esc(s.n)+'</b><small>'+fmt(t)+' to '+fmt(t+stepMin(s))+' ('+stepMin(s)+' min)</small></div></li>';
    }
    t+=stepMin(s);
  });
  if(editing)html+='<li class="step"><button class="ghost" id="addStep">Add step</button></li>';
  var ul=$('steps');
  if(ul.getAttribute('data-sig')!==html){
    var active=document.activeElement;
    if(forceRender||!(editing&&active&&ul.contains(active))){ul.innerHTML=html;ul.setAttribute('data-sig',html);}
  }
  var tt=start;
  S.steps.forEach(function(x,i){var d=stepMin(x),el=ul.querySelector('[data-tm="'+i+'"]');if(el)el.textContent=fmt(tt)+' to '+fmt(tt+d)+' ('+d+' min)';tt+=d;});
  var pct=S.steps.length?Math.round(done/S.steps.length*100):0;
  $('prog').style.width=pct+'%';
  $('progTxt').textContent=done+' of '+S.steps.length+' done';
  $('editBtn').textContent=editing?'Done editing':'Edit steps';
}
$('steps').addEventListener('change',function(e){
  var c=e.target.getAttribute('data-chk');
  if(c!==null){c=+c;var i=S.done.ids.indexOf(c);if(i>-1)S.done.ids.splice(i,1);else S.done.ids.push(c);save();rerender();}
});
$('steps').addEventListener('input',function(e){
  var i=e.target.getAttribute('data-i');if(i===null)return;
  var f=e.target.getAttribute('data-f');S.steps[+i][f]=f==='m'?(+e.target.value||0):e.target.value;save();update();
});
$('steps').addEventListener('click',function(e){
  if(!editing){var li=e.target.closest&&e.target.closest('li.step');var cb=li&&li.querySelector('input[data-chk]');if(cb&&e.target!==cb){cb.click();return;}}
  var d=e.target.getAttribute('data-del');
  if(d!==null){S.steps.splice(+d,1);S.done.ids=[];save();rerender();}
  var f=e.target.getAttribute('data-fill'),u=e.target.getAttribute('data-up');
  if(f!==null){var st=S.steps[+f];if(st.flex){st.flex=false;st.m=st.m||5;}else{S.steps.forEach(function(x){x.flex=false;});st.flex=true;}save();rerender();}
  if(u!==null){var k=+u,tmp=S.steps[k];S.steps[k]=S.steps[k-1];S.steps[k-1]=tmp;S.done.ids=[];save();rerender();}
  if(e.target.id==='addStep'){S.steps.push({n:'New step',m:5});save();rerender();}
});
$('editBtn').onclick=function(){editing=!editing;rerender();};
$('resetBtn').onclick=function(){S.done={date:today(),ids:[]};save();rerender();};

// weather
var WX={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
function isSnow(c){return [71,73,75,77,85,86,56,57,66,67].indexOf(c)>-1;}
function advice(feels,hi,lo,rain,snow,wind){
  var top,items=[];
  if(feels<=-15){top='Bitter cold';items=['Winter parka','Insulated boots','Toque, scarf, mitts','Thermal layer'];}
  else if(feels<=-5){top='Cold';items=['Winter coat','Toque and gloves','Warm boots'];}
  else if(feels<=5){top='Chilly';items=['Warm jacket','Hat and gloves','Closed shoes'];}
  else if(feels<=12){top='Cool';items=['Light jacket or sweater','Long pants'];}
  else if(feels<=18){top='Mild';items=['Hoodie or light layer'];}
  else if(feels<=24){top='Warm';items=['T-shirt','Light layer for indoors'];}
  else{top='Hot';items=['Light clothes','Water bottle','Sunscreen'];}
  if(snow){items.push('Waterproof boots');}
  else if(rain>=40){items.push('Umbrella or rain jacket');}
  if(wind>=30){items.push('Windproof outer layer');}
  if(hi-lo>=10){items.push('Layers: swings '+Math.round(lo)+' to '+Math.round(hi)+' °C today');}
  return{top:top,items:items};
}
function wearBlock(title,a,note){
  return '<div class="st">'+title+'</div>'+(note?'<div class="sub" style="margin-top:4px">'+esc(note)+'</div>':'')+'<div style="margin-top:8px;font-weight:600">'+a.top+'</div><div class="chips">'+a.items.map(function(i){return '<span class="chip">'+esc(i)+'</span>';}).join('')+'</div>';
}
function showWear(feels,hi,lo,rain,snow,wind,tmr){
  var a=advice(feels,hi,lo,rain,snow,wind);
  var html=wearBlock('What to wear now',a);
  if(tmr)html+=wearBlock('What to wear tomorrow',advice(tmr.feels,tmr.hi,tmr.lo,tmr.rain,tmr.snow,tmr.wind),'Around '+tmr.at);
  $('wear').innerHTML=html;
}
function manual(msg){
  $('manual').classList.remove('hide');
  $('gWx').href='https://www.google.com/search?q='+encodeURIComponent('weather '+(S.city||''));
  if(msg)$('wxOut').textContent=msg;
}
function fromManual(){

function iconFor(code,day){

  var tNow=h.temperature_2m[Math.min(nowH,h.temperature_2m.length-1)],fNow=h.apparent_temperature[Math.min(nowH,h.apparent_temperature.length-1)];

  renderHourly(h);

function mkFetch(sym){
  var path='/v8/finance/chart/'+encodeURIComponent(sym)+'?range=1d&interval=15m';
  var urls=['https://query1.finance.yahoo.com'+path,'https://query2.finance.yahoo.com'+path,'https://corsproxy.io/?url='+encodeURIComponent('https://query1.finance.yahoo.com'+path)];
  function go(i){
    if(i>=urls.length)return Promise.reject(0);
    return fetch(urls[i]).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      var r=j.chart.result[0],m=r.meta,c=(r.indicators.quote[0].close||[]).filter(function(v){return v!=null;});
      var p=m.regularMarketPrice,pc=m.chartPreviousClose;
      return {p:p,pc:pc,pct:(p-pc)/pc*100,c:c};
    }).catch(function(){return go(i+1);});
  }

}

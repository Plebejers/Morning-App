:root{--bg:#000;--card:#111;--card2:#1b1b1b;--line:#2a2a2a;--tx:#fff;--mu:#8a8a8a;--red:#e5392e;--grn:#1fb85a;--org:#e8742c}

html{background:var(--bg)}

button{font:inherit;color:inherit;cursor:pointer}
.nd,h1,h2{font-family:NDot,monospace;font-weight:400}
#top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}

nav button{padding:13px 0!important}
nav button{flex:1;border:0;background:none;padding:10px 0;border-radius:999px;font:700 11px 'Space Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
nav button.on{background:var(--tx);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
h2{font-size:32px;line-height:1.05;margin-bottom:10px}
.sub{font:400 12px/1.5 'Space Mono',monospace;color:var(--mu)}
.lbl{font:400 10px 'Space Mono',monospace;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:42px;font:700 12px 'Space Mono',monospace;background:none}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;background:var(--tx);color:var(--bg);font:700 13px 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-top:14px}
.btn.gh{background:none;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.35}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:none;margin-top:8px}
.opt b{display:block;font-weight:600}
.opt span{font:400 12px 'Space Mono',monospace;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl{padding:12px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.big{font:400 44px/1 NDot,monospace}
.ovr{font:400 26px/1 NDot,monospace;min-width:44px;text-align:right}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--tx)}
.tag{display:inline-block;font:400 11px 'Space Mono',monospace;border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin:6px 6px 0 0;color:var(--mu)}
.tag.k{color:var(--tx);border-color:#555}
table{width:100%;border-collapse:collapse;font:400 13px 'Space Mono',monospace}
td,th{padding:9px 4px;text-align:right;border-top:1px solid var(--line)}
th{font-weight:400;color:var(--mu);font-size:11px;border-top:0}

td:first-child,th:first-child{text-align:left;width:22px;color:var(--mu)}
tr.me td{color:var(--tx);font-weight:700}
tr.up td:first-child{color:var(--grn)}
tr.dn td:first-child{color:var(--red)}
.ev{padding:6px 0;font:400 13px 'Space Mono',monospace}
.msg{padding:12px 0;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}

.pitch{display:block;margin:4px auto 0;width:150px}
.em #top{display:none}
.sty body,.sty .sub,.sty .lbl,.sty .chip,.sty .btn,.sty nav button,.sty table,.sty .ev,.sty .tag,.sty .opt span{font-family:var(--ff)!important;letter-spacing:0}
.sty .nd,.sty h1,.sty h2,.sty .big,.sty .ovr{font-family:var(--ff);font-weight:700;letter-spacing:-.02em}
.sty .lbl,.sty .btn,.sty nav button{text-transform:none}
.sty .lbl{font-size:12px}.sty .btn{font-size:16px}.sty .chip{font-size:14px;font-weight:600}
.sty .btn,.sty .chip.on,.sty nav button.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.s-ios .card{border:0;border-radius:14px}.s-ios .chip,.s-ios .opt{border-radius:10px}.s-ios .btn{border-radius:12px}

.em body{padding-top:4px;padding-bottom:180px}
.em nav{bottom:24px}
.tp{position:relative;aspect-ratio:.82;border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.tp:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.tp:after{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:1px solid var(--line);border-radius:50%}
.tpb{position:absolute;z-index:1;transform:translate(-50%,-50%);width:66px;padding:6px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font:700 12px/1.15 'Space Mono',monospace;text-align:center}
.tpb small{display:block;font:400 10px/1.3 'Space Mono',monospace;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.attr{display:inline-block;margin-right:10px}

.cmp{display:flex;align-items:center;gap:10px;margin-top:14px}

function seg(a,b){

  var mx=cl(1.35+d*0.07,0.25,3.6),ox=cl(1.35-d*0.07,0.25,3.6),k=c.ap==='press'?1.1:c.ap==='low'?0.8:1;

  for(i=0;i<og;i++)c.lg.push({m:ri(a+1,b),t:'Goal for '+opp.n,u:0});

}

    var dc=0;if(m>0)dc=res==='w'?5:res==='d'?1:-4;if(scorers[p.id])dc+=6*scorers[p.id];if(p.id===c.gam)dc+=8;if(c.man&&m===90&&p.age<=16)dc+=3;if(p.id===c.subIn&&p.age<=16)dc+=5;if(m===0&&p.m0>=3)dc-=4;
    if(p.tr.indexOf('fragile')>=0)dc*=2;p.cf=cl(p.cf+dc,0,100);
    if(p.gs>0){p.gs--;if(!p.gs){p.pot=Math.min(95,p.pot+3);p.o+=2;lines.push(first(p)+' has grown into his body. He looks like a different player.');}}
    var unk=p.tr.filter(function(t){return p.kn.indexOf(t)<0;});
    if(unk.length&&p.ap>=3&&m>0&&Math.random()<0.3){var t=unk[0];p.kn.push(t);lines.push('Scout note: '+p.n+' '+TRS[t]+'.');}
  });
  // players leaving
  G.sq.slice().forEach(function(p){if(p.m0>=6&&p.cf<25&&p.age>=16&&Math.random()<0.3){G.sq.splice(G.sq.indexOf(p),1);lines.push(p.n+' has left for '+teamName([])+'. He was not getting minutes.');G.dr-=6;}});
  // board
  var dch=res==='w'?(strong?8:5):res==='d'?(strong?2:0):(strong?-2:-6);if(G.stake)dch*=2;G.ch=cl(G.ch+dch,0,100);
  var kids=c.xi.map(byId).filter(function(p){return p&&p.age<=16;}).length;
  var ddr=kids>=3?3:kids===2?1:kids===1?-1:-4;if(c.gam)ddr+=2;if(c.subIn&&byId(c.subIn)&&byId(c.subIn).age<=16)ddr+=1;G.dr=cl(G.dr+ddr,0,100);
  // flavour

  var benchKid=G.sq.filter(function(p){return p.age<=17&&mins[p.id]===0&&p.m0>=2;})[0];
  if(benchKid&&Math.random()<0.35)lines.push('Email from the '+last(benchKid)+' family: "'+pick([first(benchKid)+' trains harder than anyone. Why is he not starting?','We drove two hours to watch '+first(benchKid)+' sit on the bench.',first(benchKid)+' says he is fine. He is not fine.'])+'"');
  else if(c.subOut&&Math.random()<0.25){var so=byId(c.subOut);if(so)lines.push('Email from the '+last(so)+' family: "Why was '+first(so)+' subbed at 70? He was our best player."');}

  G.sq.forEach(function(p){p.rest=false;});G.sc=null;
  G.last={why:why,o:opp.n,home:c.home,s:c.s.slice(),lg:c.lg,notes:c.notes,lines:lines,potm:potm?potm.n:'',dch:dch,ddr:ddr,res:res};

}
function rec(a,b,ga,gb){
  var A=G.tb[a],B=G.tb[b];A.p++;B.p++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;
  if(ga>gb){A.w++;B.l++;A.pts+=3;}else if(ga<gb){B.w++;A.l++;B.pts+=3;}else{A.d++;B.d++;A.pts++;B.pts++;}
}

/* random events */
function rollEvent(){
  G.ev=null;if(Math.random()>0.22)return;
  var r=Math.random(),y=G.sq.filter(function(p){return p.age<=17;}).sort(function(a,b){return b.ps-a.ps;});
  if(r<0.2&&y.length){var p=y[0];G.ev={ch:1,k:'trial',id:p.id,t:teamName([])+' want '+p.n+' on a two-week trial. If it goes well, he is gone.',o:[['Let him go','The fee keeps the chairman happy.'],['Keep him','Tell him he matters here.']]};}
  else if(r<0.4){var s=G.sq.filter(function(p){return p.age<=16&&!p.gs;});if(s.length){var q=pick(s);q.gs=4;msg(q.n+' grew 6 cm in a month. He is all knees and elbows for a few weeks.');G.ev={k:'info',t:q.n+' grew 6 cm in a month. He is all knees and elbows for a few weeks.'};}}
  else if(r<0.6){G.rain=true;G.ev={k:'info',t:'Heavy rain forecast for the next match. Short passing will suffer.'};}
  else if(r<0.8){G.stake=true;G.ev={k:'info',t:'The club sponsor is coming to watch the next match. The chairman will take this one personally.'};}
  else G.ev={ch:1,k:'dinner',t:'The senior players ask if the club will pay for a team dinner.',o:[['Pay for it','Good for morale. The chairman sighs.'],['Not now','Money is tight.']]};
}
function evChoice(i){

  else if(e.k==='dinner'){if(i===0){G.sq.forEach(function(p){p.cf=cl(p.cf+5,0,100);});G.ch=cl(G.ch-4,0,100);msg('Team dinner. Someone ordered four desserts.');}else{G.sq.forEach(function(p){if(p.age>=17)p.cf=cl(p.cf-2,0,100);});msg('No dinner. The older players noticed.');}}

/* season */
function endSeason(){
  var ord=order(),pos=ord.indexOf(0)+1,t0=G.tier,move=0,head;
  if(pos===1&&G.tier===1){G.troph++;head='Champions of the '+TN[1]+'!';}
  else if(pos<=2&&G.tier>1){move=-1;head='Promoted! Next season: '+TN[G.tier-1]+'.';}
  else if(pos>=7&&G.tier<4){move=1;head='Relegated to the '+TN[G.tier+1]+'.';}
  else head='Finished '+pos+(pos===1?'st':pos===2?'nd':pos===3?'rd':'th')+' in the '+TN[G.tier]+'.';
  var bt=[],stall=[],grad=[];
  G.sq.forEach(function(p){var gn=p.o-p.s0;if(gn>=5)bt.push(p.n+' (+'+gn.toFixed(0)+')');else if(p.age<=17&&gn<2&&p.pot-p.o>12)stall.push(p.n);if(p.age>=18)grad.push(p.n);});
  var sacked=G.ch<15||G.dr<15;
  G.hist.push({s:G.season,t:t0,pos:pos});
  G.eos={head:head,pos:pos,bt:bt,stall:stall,grad:grad,move:move,sacked:sacked,why:G.ch<15?'The chairman has had enough of the results.':G.dr<15?'The development director says you forgot what an academy is for.':''};
  G.phase='eos';
}
function newSeason(){
  var e=G.eos;G.tier=cl(G.tier+e.move,1,4);G.season++;
  G.sq=G.sq.filter(function(p){return p.age<18;});
  G.sq.forEach(function(p){p.age++;p.s0=p.o;p.m0=0;p.ft=100;p.gs=0;p.rest=false;});
  Object.keys(MIX).forEach(function(pos){var have=G.sq.filter(function(p){return p.pos===pos;}).length;for(var i=have;i<MIX[pos];i++)G.sq.push(mkP(pos,Math.random()<0.6?15:16,G.tier));});
  G.ch=Math.round((G.ch+60)/2);G.dr=Math.round((G.dr+60)/2);
  mkLeague();G.eos=null;G.phase='pre';G.ev=null;G.rain=false;G.stake=false;
  msg('Season '+G.season+' starts in the '+TN[G.tier]+'. New intake has arrived.');
  save();render();
}

        +'<div class="sub" style="margin-top:8px">'+p.ap+' appearances. Best role: '+(function(){var b=null,bv=-9;Object.keys(RN).forEach(function(rr){var g=Object.keys(RG).filter(function(k){return RG[k].indexOf(rr)>=0;});var ok=pos==='GK'?false:pos==='DF'?g.indexOf('FB')>=0:pos==='MF'?(g.indexOf('CM')>=0||g.indexOf('AM')>=0||g.indexOf('W')>=0||g.indexOf('FB')>=0):g.indexOf('ST')>=0||g.indexOf('W')>=0;if(ok&&suit(p,rr)>bv){bv=suit(p,rr);b=rr;}});return b?RN[b][0].toLowerCase():'keeper';})()+'.</div></div>';

function vNotes(){
  var h='<div class="card"><h2>Scout\'s notebook</h2><div class="lbl">Approach vs their style</div>';
  h+='<div>High press: great against teams that play out from the back. Gets torn apart by teams that go long, and struggles against counters.</div>';
  h+='<div style="margin-top:8px">Low block: frustrates pressing teams and handles long balls. Starved against patient passers.</div>';
  h+='<div style="margin-top:8px">Mid block: safe, with a small edge against counter teams.</div>';
  h+='<div class="lbl">Shapes</div><div>4-3-3: good against passing teams, exposed by counters.<br>4-4-2 ◇: compact middle, handles long balls, weak out wide against a press.<br>4-4-2: two banks of four. Solid against long balls, overrun by good passers.<br>4-2-3-1: a little better against everything, best at nothing.<br>4-1-4-1: the holding midfielder screens counters, the lone striker struggles against a press.<br>4-3-2-1: narrow, plays through a press, exposed to long balls.<br>3-5-2: extra man to play through a press, wingbacks get caught on the counter.<br>3-4-3: all-out attack. Smothers passing teams, punished by counters.<br>3-4-2-1: two tens find space behind a press, wingbacks exposed on the break.<br>5-3-2: park the bus. Shuts down counters and long balls, invites passing teams to keep the ball.</div>';
  h+='<div class="lbl">Roles</div>'+Object.keys(RN).map(function(r){return '<div style="margin-top:6px"><b>'+RN[r][0]+'</b> <span class="sub">'+RN[r][3]+' Needs '+RN[r][2].map(function(k){return AN[k].toLowerCase();}).join(' and ')+'.</span></div>';}).join('');
  h+='<div class="lbl">Roles vs styles</div><div>Overlapping fullbacks and poachers hurt passing teams but leave space for counters. Inverted fullbacks, target men and shadow strikers beat a press. Playmakers, wingers and false 9s unlock a deep block, but a press hunts down a playmaker. Ball-winners break up passing teams. Stay-at-home fullbacks shut down counters.</div>';
  h+='<div class="lbl">Tempo and width</div><div>Patient build-up struggles against a press and suits breaking down a deep block. Direct play skips a press but runs into a deep block. Going wide stretches a deep block, staying narrow helps against passing teams and long balls.</div>';
  h+='<div class="lbl">Fit</div><div>Players in roles that suit their pace, passing or work rate play better and develop faster. Square pegs in round holes do the opposite.</div>';
  h+='<div class="lbl">Scouting</div><div>The scout report is a best guess. Teams you beat may change their style for the return match, and some switch approach mid-game.</div>';
  h+='<div class="lbl">Rain</div><div>Hurts short passing: 4-3-3 and 4-2-3-1 suffer, and so do teams that play out from the back.</div>';
  h+='<div class="lbl">Development</div><div>Minutes grow players. 15 and 16 year olds grow fastest. Confidence speeds it up. Players left on the bench too long lose confidence and may leave.</div>';
  h+='<div class="lbl">Traits</div>'+TRK.map(function(t){return '<div style="margin-top:6px"><b>'+esc(TR[t][0])+'</b> <span class="sub">'+esc(TR[t][1])+'</span></div>';}).join('')+'</div>';
  h+='<div class="card"><div class="lbl" style="margin-top:0">Career</div><button class="btn gh" data-a="restart">Start a new career</button></div>';
  return h;
}
